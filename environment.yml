name: spinw-tutorial
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ipykernel
  # Linux display server and software OpenGL, installed without apt/root.
  - xorg-xvfb-server=21.1.25
  - mesa-llvmpipe=26.2.6
  - libgl
  - libegl
  - libopengl
  - dbus
  - xcb-util-cursor
  - xcb-util-wm
  - xcb-util-image
  - xcb-util-keysyms
  - xcb-util-renderutil
  - libxkbcommon
  - pip:
      - pyspinw==1.1.0b2
      - PySide6-Essentials==6.12.0
      - ase==3.29.0
      - numpy==2.5.4
      - packaging
      - pycifrw==5.0.1
      - spglib==2.8.0
      - scipy==1.18.1
      - PyOpenGL>=3.1.10
      - matplotlib==3.11.2
      - imageio==2.38.1
      - pyvirtualdisplay==3.0
